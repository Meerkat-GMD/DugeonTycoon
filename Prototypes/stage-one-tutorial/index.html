<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>던전 타이쿤 · 1스테이지 가이드</title>
  <link rel="stylesheet" href="tutorial.css">
  <script src="tutorial.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="seal" aria-hidden="true">✦</span><div>던전 타이쿤<small>플레이 가능한 가이드 시안</small></div></div>
    <div class="top-actions">
      <button id="skip" class="quiet" type="button">가이드 건너뛰기</button>
      <button id="restart" class="quiet" type="button">↻ 다시 시작</button>
    </div>
  </header>
  <main>
    <div class="stage-heading">
      <div><div id="stage-number" class="eyebrow">1스테이지</div><h1 id="stage-name">성문으로 가는 길</h1></div>
      <div id="phase" class="phase">몬스터 배치</div>
    </div>
    <div class="layout">
      <aside class="party panel" aria-label="원정대">
        <div class="section-title">원정대 <strong id="level">레벨 1</strong></div>
        <div id="party-xp" class="xp"><div class="stat-line"><span>파티 경험치</span><span id="xp-text">0 / 10</span></div><progress id="xp" max="10" value="0" aria-label="파티 경험치"></progress></div>
        <div id="heroes"></div>
        <div class="fatigue"><div class="stat-line"><span>파티 피로</span><span id="fatigue-text">여유</span></div><progress id="fatigue" max="156" value="0" aria-label="파티 피로"></progress></div>
      </aside>
      <section class="board panel" aria-label="던전 지도">
        <div class="board-head"><div><span class="room-icon" aria-hidden="true">▦</span> 던전 지도</div><button id="whole" type="button" class="quiet" title="휠로 확대·축소하고, 오른쪽 또는 가운데 버튼으로 화면을 옮길 수 있습니다.">전체 보기</button></div>
        <div id="map-frame" class="map-frame">
          <canvas id="map" tabindex="0" aria-label="던전 지도. 배치할 타일을 클릭하거나 방향키로 이동한 뒤 엔터를 누르세요."></canvas>
          <button id="recommended" type="button" aria-label="추천 타일에 해골 검사 배치" title="추천 타일"></button>
          <div id="map-status" class="map-status" hidden></div>
          <div id="board-sheet" class="board-sheet" hidden></div>
        </div>
        <div class="legend"><span><i class="entry"></i> 입구</span><span><i class="patrol"></i> 고정 순회로</span><span><i class="chest"></i> 보물 상자</span><span><i class="boss"></i> 보스방</span></div>
      </section>
      <aside id="guide" class="guide panel" aria-label="가이드">
        <div class="guide-label"><span aria-hidden="true">✦</span> 원정 가이드</div>
        <div id="guide-content" aria-live="polite"></div>
        <div id="guide-progress" class="guide-progress" aria-label="가이드 진행 단계"></div>
        <div class="journal"><div class="section-title">원정 기록</div><ol id="journal" aria-live="polite"></ol></div>
      </aside>
      <section class="controls panel" aria-label="원정 조작">
        <div id="placement" class="control-row">
          <div><div class="section-title">몬스터 배치</div><div id="budget" class="budget">위협 예산 <strong>6 / 6</strong></div></div>
          <div id="tools" class="tools"></div>
          <button id="depart" type="button" class="primary">원정 출발 <span aria-hidden="true">→</span></button>
        </div>
        <div id="expedition" class="control-row" hidden>
          <div class="faith"><div class="section-title">신앙 <strong id="faith-text">3</strong></div><div id="faith-pips" aria-hidden="true"></div></div>
          <div class="tools time" aria-label="원정 속도">
            <button id="pause" type="button">일시정지</button><button id="play" type="button">1배속</button><button id="fast" type="button">2배속</button>
          </div>
          <div class="tools powers"><button id="bless" type="button">축복 <small>✦ 1</small></button><button id="rest" type="button">피로 회복 <small>✦ 1</small></button></div>
        </div>
      </section>
    </div>
    <p class="preview-note">전투와 이동은 안내 흐름을 확인할 수 있도록 짧게 재현했습니다.</p>
  </main>
  <template id="hero-template">
    <button type="button" class="hero">
      <img alt=""><span class="hero-details"><strong></strong><small class="gear"></small><span class="hp"><i></i></span><small class="health"></small></span>
    </button>
  </template>
</body>
</html>
